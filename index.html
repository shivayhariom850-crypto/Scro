<html>
<head>
  <title>Scro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: black;
      color: white;
      overflow-x: hidden;
    }

    .video {
      height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
      border-bottom: 1px solid #333;
    }

    .left {
      max-width: 70%;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 18px;
      text-align: center;
    }

    button {
      background: none;
      border: none;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.7;
    }
  </style>
</head>

<body>

<!-- FIRST FEELS -->
<div class="video">
  <div class="left">
    <h3>@user1</h3>
    <p>This is a Feels video 🔥</p>
  </div>

  <div class="actions">
    <button>❤️ Vibe</button>
    <button>💬 Drop</button>
    <button>🔁 Echo</button>
    <button>👤 Track</button>
    <button>💌 Ping</button>
    <button>✨ Fura</button>
  </div>
</div>

<script>
  let count = 2;

  window.addEventListener("scroll", () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 10) {
      
      let div = document.createElement("div");
      div.className = "video";

      div.innerHTML = `
        <div class="left">
          <h3>@user${count}</h3>
          <p>Another Feels video 😎</p>
        </div>

        <div class="actions">
          <button>❤️ Vibe</button>
          <button>💬 Drop</button>
          <button>🔁 Echo</button>
          <button>👤 Track</button>
          <button>💌 Ping</button>
          <button>✨ Fura</button>
        </div>
      `;

      document.body.appendChild(div);
      count++;
    }
  });
</script>

</body>
</html>
<!DOCTYPE html>
<html>
<head>
  <title>Scro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: black;
      font-family: Arial;
      color: white;
      overflow: hidden;
    }

    .feed {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .video {
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      bottom: 20px;
      left: 15px;
    }

    .overlay h3 {
      margin: 0;
    }

    .actions {
      position: absolute;
      right: 10px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: center;
    }

    .btn {
      font-size: 14px;
      cursor: pointer;
    }

    .topbar {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
    }

    .bottombar {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 10px;
      background: rgba(0,0,0,0.5);
    }
  </style>
</head>

<body>

<div class="topbar">
  <b>Scro</b>
  <span>💌 Ping</span>
</div>

<div class="feed">

  <!-- VIDEO 1 -->
  <div class="video">
    <video src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay muted loop></video>

    <div class="overlay">
      <h3>@user1</h3>
      <p>This is Feels 🔥</p>
    </div>

    <div class="actions">
      <div class="btn">❤️ Vibe</div>
      <div class="btn">💬 Drop</div>
      <div class="btn">🔁 Echo</div>
      <div class="btn">👤 Track</div>
      <div class="btn">✨ Fura</div>
    </div>
  </div>

  <!-- VIDEO 2 -->
  <div class="video">
    <video src="https://www.w3schools.com/html/movie.mp4" autoplay muted loop></video>

    <div class="overlay">
      <h3>@user2</h3>
      <p>Another Feels 😎</p>
    </div>

    <div class="actions">
      <div class="btn">❤️ Vibe</div>
      <div class="btn">💬 Drop</div>
      <div class="btn">🔁 Echo</div>
      <div class="btn">👤 Track</div>
      <div class="btn">✨ Fura</div>
    </div>
  </div>

</div>

<div class="bottombar">
  <span>🏠</span>
  <span>🔍</span>
  <span>➕</span>
  <span>❤️</span>
  <span>👤</span>
</div>

</body>
  </html>
